<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 380px; margin: 12px; }
  label { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  input[type=number] { width: 60px; }
  select { padding: 2px; }
  ul { list-style: none; padding: 0; margin: 8px 0; max-height: 260px; overflow-y: auto; }
  li { display: flex; gap: 6px; align-items: center; padding: 3px 0; border-bottom: 1px solid #ddd; }
  li span.t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li span.a { color: #666; white-space: nowrap; }
  button { padding: 6px 12px; }
  #summary { margin: 6px 0; color: #444; }
</style>
</head>
<body>
  <label>Not viewed for at least
    <input id="amount" type="number" min="1" value="3">
    <select id="unit">
      <option value="60000">minutes</option>
      <option value="3600000">hours</option>
      <option value="86400000" selected>days</option>
    </select>
  </label>
  <label><input id="dupes" type="checkbox" checked> Also close duplicate tabs (keeps one per page)</label>
  <label><input id="skipPinned" type="checkbox" checked> Keep pinned tabs</label>
  <label><input id="skipAudible" type="checkbox" checked> Keep tabs playing audio</label>
  <div id="summary"></div>
  <ul id="list"></ul>
  <button id="close" disabled>Close selected tabs</button>
  <script src="popup.js"></script>
</body>
</html>
